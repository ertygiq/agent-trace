<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">agent-trace terminal demo</title>
  <desc id="desc">Animated terminal showing the agent-trace command being typed and transcript output appearing.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="commandClip">
      <rect x="74" y="91" height="24" width="0">
        <!-- Steady, linear typing: constant reveal rate, no easing slide. Self-resets each 6.5s loop. -->
        <animate attributeName="width" dur="6.5s" repeatCount="indefinite" calcMode="linear"
                 values="0;0;942;942" keyTimes="0;0.0769;0.4308;1"/>
      </rect>
    </clipPath>
    <style>
      .bg { fill: #0b1020; }
      .terminal { fill: #101827; stroke: #263449; stroke-width: 1; }
      .bar { fill: #162033; }
      .dot-red { fill: #ff5f57; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #28c840; }
      .title { fill: #8ea0bb; font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .prompt { fill: #6ee7b7; font: 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .cmd { fill: #e5e7eb; font: 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { fill: #f8fafc; font: 700 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .time { fill: #94a3b8; font: 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .body { fill: #dbeafe; font: 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .bash { fill: #fef3c7; font: 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .cursor { fill: #e5e7eb; }
    </style>
  </defs>

  <rect class="bg" width="1100" height="720"/>
  <circle cx="920" cy="78" r="190" fill="#2563eb" opacity="0.16"/>
  <circle cx="180" cy="640" r="230" fill="#14b8a6" opacity="0.12"/>

  <g filter="url(#shadow)">
    <rect class="terminal" x="34" y="34" width="1032" height="652" rx="18"/>
    <rect class="bar" x="34" y="34" width="1032" height="44" rx="18"/>
    <rect class="bar" x="34" y="60" width="1032" height="18"/>
    <circle class="dot-red" cx="61" cy="56" r="7"/>
    <circle class="dot-yellow" cx="84" cy="56" r="7"/>
    <circle class="dot-green" cx="107" cy="56" r="7"/>
    <text class="title" x="550" y="61" text-anchor="middle">agent-trace demo</text>

    <text class="prompt" x="52" y="108">$</text>
    <g clip-path="url(#commandClip)">
      <text class="cmd" x="74" y="108">agent-trace --harness codex --session 019eef26-56e6-7c40-9e51-69e8e156e7fc --all</text>
    </g>
    <!-- Cursor rides the text edge at the same linear rate, then cleanly vanishes when output begins. -->
    <rect class="cursor" x="74" y="91" width="9" height="20">
      <animate attributeName="x" dur="6.5s" repeatCount="indefinite" calcMode="linear"
               values="74;74;1016;1016" keyTimes="0;0.0769;0.4308;1"/>
      <animate attributeName="opacity" dur="6.5s" repeatCount="indefinite" calcMode="linear"
               values="1;1;0;0" keyTimes="0;0.4308;0.4615;1"/>
    </rect>

    <g transform="translate(52 154)">
      <g class="line" opacity="0"><text class="label" x="0" y="0">▌ Human</text><text class="time" x="122" y="0">11:45:31</text>
        <animate attributeName="opacity" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1" keyTimes="0;0.4769;0.5015;1"/>
        <animateTransform attributeName="transform" type="translate" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0 4;0 4;0 0;0 0" keyTimes="0;0.4769;0.5015;1"/></g>
      <text class="body" x="0" y="30" opacity="0">hi there
        <animate attributeName="opacity" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1" keyTimes="0;0.4923;0.5169;1"/>
        <animateTransform attributeName="transform" type="translate" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0 4;0 4;0 0;0 0" keyTimes="0;0.4923;0.5169;1"/></text>

      <g class="line" opacity="0"><text class="label" x="0" y="82">▌ Assistant</text><text class="time" x="162" y="82">11:45:33</text>
        <animate attributeName="opacity" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1" keyTimes="0;0.5169;0.5415;1"/>
        <animateTransform attributeName="transform" type="translate" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0 4;0 4;0 0;0 0" keyTimes="0;0.5169;0.5415;1"/></g>
      <text class="body" x="0" y="112" opacity="0">Hi. What are we working on?
        <animate attributeName="opacity" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1" keyTimes="0;0.5323;0.5569;1"/>
        <animateTransform attributeName="transform" type="translate" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0 4;0 4;0 0;0 0" keyTimes="0;0.5323;0.5569;1"/></text>

      <g class="line" opacity="0"><text class="label" x="0" y="164">▌ Human</text><text class="time" x="122" y="164">11:45:47</text>
        <animate attributeName="opacity" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1" keyTimes="0;0.5569;0.5815;1"/>
        <animateTransform attributeName="transform" type="translate" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0 4;0 4;0 0;0 0" keyTimes="0;0.5569;0.5815;1"/></g>
      <text class="body" x="0" y="194" opacity="0">can you run bash sleep command to sleep for 10 seconds?
        <animate attributeName="opacity" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1" keyTimes="0;0.5723;0.5969;1"/>
        <animateTransform attributeName="transform" type="translate" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0 4;0 4;0 0;0 0" keyTimes="0;0.5723;0.5969;1"/></text>

      <g class="line" opacity="0"><text class="label" x="0" y="246">▌ Bash</text><text class="time" x="102" y="246">11:45:49</text>
        <animate attributeName="opacity" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1" keyTimes="0;0.5969;0.6215;1"/>
        <animateTransform attributeName="transform" type="translate" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0 4;0 4;0 0;0 0" keyTimes="0;0.5969;0.6215;1"/></g>
      <text class="bash" x="0" y="276" opacity="0">sleep 10
        <animate attributeName="opacity" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1" keyTimes="0;0.6123;0.6369;1"/>
        <animateTransform attributeName="transform" type="translate" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0 4;0 4;0 0;0 0" keyTimes="0;0.6123;0.6369;1"/></text>

      <g class="line" opacity="0"><text class="label" x="0" y="328">▌ Assistant</text><text class="time" x="162" y="328">11:45:52</text>
        <animate attributeName="opacity" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1" keyTimes="0;0.6369;0.6615;1"/>
        <animateTransform attributeName="transform" type="translate" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0 4;0 4;0 0;0 0" keyTimes="0;0.6369;0.6615;1"/></g>
      <text class="body" x="0" y="358" opacity="0">`sleep 10` is running. I’ll wait for it to finish.
        <animate attributeName="opacity" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1" keyTimes="0;0.6523;0.6769;1"/>
        <animateTransform attributeName="transform" type="translate" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0 4;0 4;0 0;0 0" keyTimes="0;0.6523;0.6769;1"/></text>

      <g class="line" opacity="0"><text class="label" x="0" y="410">▌ Output</text><text class="time" x="122" y="410">11:45:59</text>
        <animate attributeName="opacity" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1" keyTimes="0;0.6769;0.7015;1"/>
        <animateTransform attributeName="transform" type="translate" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0 4;0 4;0 0;0 0" keyTimes="0;0.6769;0.7015;1"/></g>

      <g class="line" opacity="0"><text class="label" x="0" y="492">▌ Assistant</text><text class="time" x="162" y="492">11:46:00</text>
        <animate attributeName="opacity" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1" keyTimes="0;0.7015;0.7262;1"/>
        <animateTransform attributeName="transform" type="translate" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0 4;0 4;0 0;0 0" keyTimes="0;0.7015;0.7262;1"/></g>
      <text class="body" x="0" y="522" opacity="0">Done.
        <animate attributeName="opacity" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1" keyTimes="0;0.7169;0.7415;1"/>
        <animateTransform attributeName="transform" type="translate" dur="6.5s" repeatCount="indefinite" calcMode="linear" values="0 4;0 4;0 0;0 0" keyTimes="0;0.7169;0.7415;1"/></text>
    </g>
  </g>
</svg>
